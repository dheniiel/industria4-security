networks:
  # nat-unprotected: sem isso, o Docker 28+ descarta o tráfego que o servidor roteia entre as redes
  wan:
    name: wan
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected }
    ipam: { config: [ { subnet: 203.0.113.0/24, gateway: 203.0.113.1 } ] }
  lan_ti:
    name: lan_ti
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected }
    ipam: { config: [ { subnet: 192.168.10.0/24 } ] }
  ot_scada:
    name: ot_scada
    driver_opts: { com.docker.network.bridge.gateway_mode_ipv4: nat-unprotected }
    ipam: { config: [ { subnet: 192.168.20.0/24 } ] }

services:
  # Servidor Ubuntu: roteador + firewall
  gateway:
    build: .
    image: lab-ot
    container_name: gateway
    cap_add: [NET_ADMIN]
    sysctls: { net.ipv4.ip_forward: 1 }           # ativa o roteamento entre as interfaces
    networks:
      wan:      { ipv4_address: 203.0.113.2 }     # interface externa (WAN)
      lan_ti:   { ipv4_address: 192.168.10.254 }  # interface interna (LAN)
      ot_scada: { ipv4_address: 192.168.20.254 }  # interface interna (OT)
    command: bash -c "route del default; route add default gw 203.0.113.1;
                      echo nameserver 8.8.8.8 > /etc/resolv.conf; sleep infinity"

  # Estação de administração (LAN)
  admin:
    build: .
    image: lab-ot
    container_name: admin
    cap_add: [NET_ADMIN]
    networks:
      lan_ti: { ipv4_address: 192.168.10.10 }
    command: bash -c "route del default; route add default gw 192.168.10.254; sleep infinity"

  # Servidor de telemetria (OT): painel 80, banco 5432 e CLP Modbus 502 simulados
  telemetria:
    build: .
    image: lab-ot
    container_name: telemetria
    cap_add: [NET_ADMIN]
    networks:
      ot_scada: { ipv4_address: 192.168.20.10 }
    command: bash -c "route del default; route add default gw 192.168.20.254; cd /tmp;
                      python3 -m http.server 80 & python3 -m http.server 5432 &
                      python3 -m http.server 502 & sleep infinity"

  # Atacante simulado na Internet (usado nos testes)
  externo:
    build: .
    image: lab-ot
    container_name: externo
    cap_add: [NET_ADMIN]
    networks:
      wan: { ipv4_address: 203.0.113.10 }
    command: bash -c "route add -net 192.168.0.0 netmask 255.255.0.0 gw 203.0.113.2; sleep infinity"
